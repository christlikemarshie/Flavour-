<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taste Quest | Local Restaurant Locator</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link href="https://googleapis.com" rel="stylesheet">
</head>
<body>

    <!-- ELEMENT 1: THE BACK 3D LAYER -->
    <div class="spline-background">
      <script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.98/build/spline-viewer.js"></script>
      <spline-viewer url="https://prod.spline.design/FST76E63lpJEZS9n/scene.splinecode"></spline-viewer>
    </div>
    <!-- ELEMENT 2: THE FOREGROUND INTERFACE OVERLAY -->
    <div class="glass-effect">
        <div class="div">
            <!-- 📷 BRANDING -->
            <img class="master-branding-logo" src="{{ url_for('static', filename='logo.png') }}" /> 
            
            <!-- TITLE + BUTTON -->
            <div class="title-and-button-row">
              <div class="title">find <br/>food<br/>anywhere</div>
              <button id="locate-btn" class="cta-button-radar">Find Food Near Me 🍽️</button>
            </div>

            <!-- GLASS RIBBONS -->
            <div class="div-2 glass-ribbon"></div>
            <div class="div-3 glass-ribbon"></div>
            <div class="div-4 glass-ribbon"></div>
            <div class="div-5 glass-ribbon"></div>
            <div class="div-6 glass-ribbon"></div>
            <div class="div-7 glass-ribbon"></div>
        </div> 
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
