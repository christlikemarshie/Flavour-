{% extends "base.html" %}

{% block title %}
    Flavour 
{% endblock %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
{% endblock %}

{% block content %}
<!-- =========================================================
     LANDING BACKGROUND LAYER
     ========================================================= -->
<script type="module" src="https://unpkg.com/@splinetool/viewer@1.12.98/build/spline-viewer.js"></script>

<!-- DESKTOP BACKGROUND -->
<div class="desktop-spline">
    <spline-viewer class="spline-background" url="https://prod.spline.design/FST76E63lpJEZS9n/scene.splinecode"></spline-viewer>
</div>

<!-- MOBILE BACKGROUND -->
<div class="mobile-rive">
    <!-- RIVE WILL GO HERE -->
     <div class="mobile-rive">
    <script src="https://unpkg.com/@lottiefiles/dotlottie-wc@0.9.4/dist/dotlottie-wc.js" type="module"></script>
    <dotlottie-wc 
       src="https://lottie.host/120be638-cccb-4a27-94d0-d86eaf76569e/PJrZ6JWZRd.lottie" 
       autoplay 
       loop>
    </dotlottie-wc>
</div>
</div>

<!-- ELEMENT 2: THE FOREGROUND INTERFACE OVERLAY -->
<div class="glass-effect">
    <div class="div">
        <!-- BRANDING -->
        <img class="master-branding-logo" src="{{ url_for('static', filename='images/logo.png') }}" alt="TasteQuest logo">

        <!-- TITLE + BUTTON -->
        <div class="title-and-button-row">
            <div class="title">
                find <br>
                food
            
            </div>
            <button id="locate-btn" class="cta-button-radar">
                <i data-lucide="search"></i>
                Find Food Near Me 
            </button>
        </div>

        <!-- GLASS RIBBONS -->
        <div class="div-2 glass-ribbon"></div>
        <div class="div-3 glass-ribbon"></div>
        <div class="div-4 glass-ribbon"></div>
        <div class="div-5 glass-ribbon"></div>
        <div class="div-6 glass-ribbon"></div>
        <div class="div-7 glass-ribbon"></div>
    </div>
</div>
<!-- FLAVOUR LOADING OVERLAY -->
<div id="flavour-loading-overlay" class="flavour-loading-overlay">

    <div class="flavour-loader">

        <div class="flavour-bowl">
            <i data-lucide="soup"></i>
        </div>

        <p>Searching....</p>

    </div>

</div>

{% endblock %}

{% block scripts %}
<script src="{{ url_for('static', filename='js/script.js') }}"></script>
<script> lucide.createIcons() </script>
{% endblock %}
